' --- GLOBAL PLANTUML CONFIGURATION ---
skinparam backgroundcolor transparent
skinparam shadowing false

<style>
root {
  ' 1. FOREGROUND & TYPOGRAPHY STYLE (Matches default Doxygen font stack)
  FontName "Andika", sans-serif
  FontColor #253555
  FontSize 13

  ' 2. GLOBAL CONNECTIONS & LINES
  LineColor #A3B8CC
  LineThickness 1.2
}

' Target Class, State, Activity, and generic elements
element {
  BackgroundColor #F4F7FB
  LineColor #A3B8CC
}

' Explicitly format the Class Diagram hierarchies
classDiagram {
  class {
    BackgroundColor #E2EBf6
    HeaderBackgroundColor #D0E1F4
    LineColor #8AA6C5
    ' Text inside the class box
    FontColor #1A2E40
  }
}

' Explicitly format notes to look like Doxygen warnings/reminders
note {
  BackgroundColor #FFFFE1
  LineColor #BBBB88
  FontColor #444422
}

' Arrow lines and text floating next to arrows
arrow {
  LineColor #6080A0
  FontColor #304050
}
</style>
